            <div>

                <option value="4">4</option>
                <option value="5">5</option>

                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="0">0</option>
              </select>
            </div>

            <div class="miles">
              <div>
                <label for="" class="form-label">miles</label>
                <input
                  type="text"
                  placeholder="From"
                  class="form-input first-input"
                />
              </div>
              <div>
                <label for="" class="form-label"></label>
                <input type="text" placeholder="To" class="form-input" />
              </div>
            </div>
            <div class="form-btns">
              <button type="submit" class="filter-btn">Search</button>
              <button class="reset-btn">Clear filters</button>
            </div>
          </form>
          <ul class="car-list"></ul>
        </div>
